name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check tag matches extension version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./apps/vscode-extension/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match apps/vscode-extension version $VERSION"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run @learn-by-diff/protocol#pack
      - run: pnpm exec vp run learn-by-diff#pack
      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: pnpm exec vsce package --no-dependencies -o ../../learn-by-diff-${{ github.ref_name }}.vsix
      - name: Require publish secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT secret is missing"
            exit 1
          fi
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT secret is missing"
            exit 1
          fi
      - name: Publish to Visual Studio Marketplace
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --no-dependencies --packagePath ../../learn-by-diff-${{ github.ref_name }}.vsix
      - name: Publish to Open VSX
        working-directory: apps/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish ../../learn-by-diff-${{ github.ref_name }}.vsix
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "learn-by-diff-${{ github.ref_name }}.vsix" \
            --title "LearnByDiff ${{ github.ref_name }}" \
            --notes "LearnByDiff ${{ github.ref_name }} for VS Code Marketplace and Open VSX."
