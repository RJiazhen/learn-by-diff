packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  jsonc-parser: ^3.3.1
  vitepress: ^1.6.4

overrides:
  vite: "catalog:"
  vitepress>vite: npm:vite@6.3.6
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@vscode/vsce-sign": true
  keytar: true
  esbuild: true
